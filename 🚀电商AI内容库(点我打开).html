<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>🚀 电商+AI内容库 - 快捷入口</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0891b2 0%, #7c3aed 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    background: white;
    padding: 3rem 4rem;
    border-radius: 20px;

    text-align: center;
    max-width: 400px;

  .icon { font-size: 4rem; margin-bottom: 1rem; }

  p { color: #64748b; margin: 0 0 1.5rem 0; font-size: 0.9rem; }
  .btn {
    display: inline-block;
    padding: 0.875rem 2rem;
    background: linear-gradient(135deg, #0891b2, #7c3aed);
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 1rem;
    box-shadow: 0 4px 15px rgba(8,145,178,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(8,145,178,0.5);
  }
  .tip {
    margin-top: 1.5rem;
    padding: 0.75rem 1rem;
    background: #fef3c7;
    border-radius: 8px;
    font-size: 0.8rem;
    color: #92400e;
    text-align: left;

  .tip strong { display: block; margin-bottom: 0.3rem; }

</head>

  <div class="card">

      <strong>💡 小提示</strong>
      把这个文件拖到桌面或 Dock 上，以后双击就能直接打开工作台。
    </div>
  </div>
  <script>
    // 自动跳转到主页面（如果用户直接双击打开）
    setTimeout(function() {
      window.location.href = 'ecommerce-ai-dynamic-library.html';
    }, 500);
  </script>
</body>
</html>
